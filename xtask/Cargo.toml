[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.2.1", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
ureq = { version = "=3.5.1", default-features = false, features = [
  "json",
  "rustls",
] }

[dev-dependencies]
mockito = "=1.7.2"
