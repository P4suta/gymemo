# `mise x -- just mutate` changes the package sources one operator at a time and runs the package tests against each change.
# The experimental tier holds every operator of the tool.
sources-path: Sources
operator-tier: experimental
testing-framework: swift-testing
# The package tests finish within 5 seconds, and the gate calls a timeout inconclusive.
# The limit leaves room for a busy machine, so only a change that keeps the tests from ending reaches it.
timeout: 90
