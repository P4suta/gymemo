name: gymemo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
packages:
  Gymemo:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  gymemo:
    type: application
    platform: iOS
    sources:
      - App
      - path: Config/Launch.xcassets
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Gymemo
        product: GymemoCore
      - package: Gymemo
        product: GymemoKit
      - package: Gymemo
        product: GymemoCopy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.gymemo
        # The app has no icon until its delivery route is chosen, so the asset catalog compiler looks for none.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: gymemo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, zh-Hans, zh-Hant]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  gymemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: gymemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.gymemo.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  gymemo:
    build:
      targets:
        gymemo: all
    test:
      config: Debug
      targets: [gymemoUITests]
    run:
      config: Debug
    archive:
      config: Release
