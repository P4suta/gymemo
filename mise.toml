[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
just = "1.59.0"
node = "26.13.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
gitleaks = "8.30.1"
xcodegen = { version = "2.46.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
"github:ericodx/swift-mutation-testing" = { version = "1.7.1", os = ["macos"] }
"github:rorkai/App-Store-Connect-CLI" = { version = "6.6.0", bin = "asc" }
"github:anchore/syft" = { version = "1.57.1", bin = "syft" }
"github:EmbarkStudios/cargo-deny" = { version = "0.20.2", bin = "cargo-deny" }
