name: Native candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native App Store platform
        type: choice
        required: true
        options: [iOS, macOS, visionOS]

permissions: {}

concurrency:
  group: native-candidate-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Require the local release checks
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read # Reads the owner's result for the selected source commit.
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.11.6"
          install_args: rust just
      - name: Require the owner's result for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise x -- just require-qualification "$GITHUB_SHA"
  archive:
    name: Preserve the unsigned native archive
    needs: qualification
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read # Rechecks local qualification while sealing the archive.
      id-token: write # Attests the candidate without signing or upload credentials.
      attestations: write # Records provenance for the original archive bytes.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.11.6"
          install_args: rust just xcodegen github:rorkai/App-Store-Connect-CLI github:anchore/syft
      - if: github.run_attempt == 1
        run: mise x -- just generate
      - name: Archive iPhone, iPad, and the companion Watch app
        if: github.run_attempt == 1 && inputs.platform == 'iOS'
        run: mise x -- asc xcode archive --project gymemo.xcodeproj --scheme gymemo --configuration Release --archive-path target/gymemo.xcarchive --xcodebuild-flag=-destination --xcodebuild-flag=generic/platform=iOS --xcodebuild-flag=CODE_SIGNING_ALLOWED=NO --xcodebuild-flag=CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID"
      - name: Archive the native Mac app
        if: github.run_attempt == 1 && inputs.platform == 'macOS'
        run: mise x -- asc xcode archive --project gymemo.xcodeproj --scheme gymemo --configuration Release --archive-path target/gymemo.xcarchive --xcodebuild-flag=-destination --xcodebuild-flag=generic/platform=macOS --xcodebuild-flag=CODE_SIGNING_ALLOWED=NO --xcodebuild-flag=CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID"
      - name: Archive the native Vision Pro app
        if: github.run_attempt == 1 && inputs.platform == 'visionOS'
        run: mise x -- asc xcode archive --project gymemo.xcodeproj --scheme gymemo --configuration Release --archive-path target/gymemo.xcarchive --xcodebuild-flag=-destination --xcodebuild-flag=generic/platform=visionOS --xcodebuild-flag=CODE_SIGNING_ALLOWED=NO --xcodebuild-flag=CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID"
      - name: Inspect and seal the original archive and dependency inventory
        if: github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: mise x -- just seal-native "$PLATFORM" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - if: github.run_attempt == 1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            native-candidate.tar
            native-candidate.json
      - name: Reuse the original archive on a retry
        if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-${{ inputs.platform }}-${{ github.run_id }}-${{ github.sha }}-attempt-1
          digest-mismatch: error
      - name: Verify the preserved candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify native-candidate.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-candidate.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          gh attestation verify native-candidate.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-candidate.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ inputs.platform }}-${{ github.run_id }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            native-candidate.tar
            native-candidate.json
          if-no-files-found: error
          retention-days: 30
