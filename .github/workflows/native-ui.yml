name: Native Mac UI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-mac-ui
  cancel-in-progress: false

jobs:
  build:
    name: Build Mac UI products
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Attests test products before protected signing.
      attestations: write # Binds the preserved products to this source.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: rust just xcodegen
      - run: mise x -- just build-mac-ui
      - run: tar --create --file mac-ui-unsigned.tar --directory target/mac-ui/Build Products
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mac-ui-unsigned.tar
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-ui-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: mac-ui-unsigned.tar
          if-no-files-found: error
          retention-days: 35
  signing:
    name: Sign Mac UI products
    needs: build
    runs-on: xcode-27
    timeout-minutes: 10
    environment: native-signing
    permissions:
      contents: read
      id-token: write # Attests the products after signing.
      attestations: write # Verifies build provenance and binds signed products to the same source.
    env:
      MISE_AUTO_INSTALL: "false"
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: mise.toml
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: github:rorkai/App-Store-Connect-CLI
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          digest-mismatch: error
      - name: Verify the preserved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify mac-ui-unsigned.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-ui.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          mkdir mac-ui
          tar --extract --file mac-ui-unsigned.tar --directory mac-ui
      - name: Install the expected application identity
        env:
          DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA256: ${{ vars.APPLE_DISTRIBUTION_CERTIFICATE_SHA256 }}
        run: |
          umask 077
          test "$DOPPLER_PROJECT" = gymemo
          test "$DOPPLER_CONFIG" = ci_native_signing
          test -n "$CERTIFICATE_SHA256"
          mkdir -p "$RUNNER_TEMP/gymemo-ui-signing"
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/gymemo-ui-signing/application.p12"
          printf %s "$CERTIFICATE_PASSWORD" > "$RUNNER_TEMP/gymemo-ui-signing/application-password"
          openssl rand -base64 32 > "$RUNNER_TEMP/gymemo-ui-signing/keychain-password"
          mise x -- asc signing keychain install --identity "$RUNNER_TEMP/gymemo-ui-signing/application.p12" --identity-password-file "$RUNNER_TEMP/gymemo-ui-signing/application-password" --keychain "$RUNNER_TEMP/gymemo-ui.keychain-db" --keychain-password-file "$RUNNER_TEMP/gymemo-ui-signing/keychain-password" --expected-certificate-sha256 "$CERTIFICATE_SHA256" --add-to-search-list --confirm
      - name: Sign the preserved app and UI runner without executing them
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          codesign --force --sign "Apple Distribution: Yasunobu Sakashita ($APPLE_TEAM_ID)" --keychain "$RUNNER_TEMP/gymemo-ui.keychain-db" --preserve-metadata=identifier,entitlements,flags,runtime mac-ui/Products/Debug/gymemo.app
          codesign --force --sign "Apple Distribution: Yasunobu Sakashita ($APPLE_TEAM_ID)" --keychain "$RUNNER_TEMP/gymemo-ui.keychain-db" --preserve-metadata=identifier,entitlements,flags,runtime mac-ui/Products/Debug/gymemoNativeUITests-Runner.app/Contents/PlugIns/gymemoNativeUITests.xctest
          codesign --force --sign "Apple Distribution: Yasunobu Sakashita ($APPLE_TEAM_ID)" --keychain "$RUNNER_TEMP/gymemo-ui.keychain-db" --preserve-metadata=identifier,entitlements,flags,runtime mac-ui/Products/Debug/gymemoNativeUITests-Runner.app
          codesign --verify --deep --strict mac-ui/Products/Debug/gymemo.app
          codesign --verify --deep --strict mac-ui/Products/Debug/gymemoNativeUITests-Runner.app
          tar --create --file mac-ui-signed.tar --directory mac-ui Products
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mac-ui-signed.tar
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-ui-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: mac-ui-signed.tar
          if-no-files-found: error
          retention-days: 35
      - name: Remove the temporary signing identity
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/gymemo-ui.keychain-db" || security delete-keychain "$RUNNER_TEMP/gymemo-ui.keychain-db"
          rm -rf "$RUNNER_TEMP/gymemo-ui-signing"
  test:
    name: Mac UI tests
    needs: signing
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read # Verifies the products before running them without signing secrets.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: rust just
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signing.outputs.artifact }}
          digest-mismatch: error
      - name: Verify and register the signed test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify mac-ui-signed.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-ui.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          mkdir -p target/mac-ui/Build
          tar --extract --file mac-ui-signed.tar --directory target/mac-ui/Build
          codesign --verify --deep --strict target/mac-ui/Build/Products/Debug/gymemo.app
          codesign --verify --deep --strict target/mac-ui/Build/Products/Debug/gymemoNativeUITests-Runner.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$GITHUB_WORKSPACE/target/mac-ui/Build/Products/Debug/gymemo.app"
      - run: mise x -- just test-mac-ui
      - run: mise x -- just check-mac-ui-result target/mac-ui.xcresult
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-ui-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/mac-ui.xcresult
          if-no-files-found: error
          retention-days: 35
