name: Website

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the website candidate
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Attests the tested website without publication credentials.
      attestations: write # Records provenance for the preserved candidate.
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: rust node just github:anchore/syft
      - run: mise x -- just setup
      - run: mise x -- just check-website
      - name: Inventory the preserved static assets
        run: |
          mise x -- syft scan dir:website/dist --source-name gymemo-support --source-version "$GITHUB_SHA" --parallelism 2 --output cyclonedx-json=website/website-sbom.cdx.json
          mise x -- just check-sbom website "$GITHUB_SHA" website/website-sbom.cdx.json
      - name: Preserve the tested files
        run: |
          tar --create --file website-candidate.tar --directory website dist website-sbom.cdx.json
          shasum -a 256 website-candidate.tar > website-candidate.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            website-candidate.tar
            website-candidate.sha256
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-website-${{ github.run_attempt }}
          path: |
            website-candidate.tar
            website-candidate.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish the verified website
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: website-production
      url: https://gymemo.yasunobu.dev
    permissions:
      contents: read
      id-token: write # Fetches the protected website publication credentials.
      attestations: read # Verifies the preserved website before publication.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mise.toml
            website/package.json
            website/package-lock.json
            website/mise.toml
            website/wrangler.jsonc
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: node
      - name: Install the pinned provider tool without repository hooks
        working-directory: website
        run: mise x -- npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: candidate
          digest-mismatch: error
      - name: Verify the candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify candidate/website-candidate.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/website.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
      - run: tar --extract --file candidate/website-candidate.tar --directory website
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: gymemo
          doppler-config: ci_website
          inject-env-vars: "false"
      - name: Deploy the preserved static assets
        working-directory: website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mise x -- npm exec --offline -- wrangler deploy
  acceptance:
    name: Check the public website
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: node just
      - run: mise x -- just setup
      - run: mise x -- just check-public-website
