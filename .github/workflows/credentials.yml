name: Credentials

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Check website credentials without publication
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: website-production
    permissions:
      contents: read
      id-token: write # Tests only the protected website identity.
    env:
      MISE_AUTO_INSTALL: "false"
    outputs:
      identity: ${{ steps.identity.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mise.toml
            website/package.json
            website/package-lock.json
            website/mise.toml
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: node
      - name: Install the pinned provider tool without repository hooks
        working-directory: website
        run: mise x -- npm ci --ignore-scripts
      - id: identity
        env:
          IDENTITY: ${{ vars.DOPPLER_IDENTITY_ID }}
        run: printf '%s\n' "value=$IDENTITY" >> "$GITHUB_OUTPUT"
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: gymemo
          doppler-config: ci_website
          inject-env-vars: "false"
      - name: Verify Cloudflare authentication without changing resources
        working-directory: website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mise x -- npm exec --offline -- wrangler whoami > /dev/null
  denied:
    name: Refuse the identity outside its environment
    needs: website
    if: always() && needs.website.outputs.identity != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      id-token: write # Confirms that the identity rejects a job without its environment.
    steps:
      - id: denied
        continue-on-error: true
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ needs.website.outputs.identity }}
          doppler-project: gymemo
          doppler-config: ci_website
          inject-env-vars: "false"
      - name: Require an authentication rejection
        env:
          OUTCOME: ${{ steps.denied.outcome }}
        run: test "$OUTCOME" = failure
