name: Native credential transport

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to verify without signing or uploading
        type: choice
        required: true
        default: iOS
        options: [iOS, macOS, visionOS]

permissions: {}

concurrency:
  group: native-credential-transport
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  installer-tool:
    name: Build the installer credential importer without secrets
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797' && inputs.platform == 'macOS'
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Attests the importer before it reaches the credential job.
      attestations: write # Binds the importer to the workflow source.
    env:
      CARGO_BUILD_JOBS: "2"
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: rust
      - run: mise x -- cargo build --locked -p xtask
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/debug/xtask
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-tool-attempt-${{ github.run_attempt }}
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1
  application:
    name: Check ${{ inputs.platform }} signing identities without signing
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: xcode-27
    timeout-minutes: 10
    environment: native-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: mise.toml
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: github:rorkai/App-Store-Connect-CLI
      - id: identity
        name: Verify the purpose and expected certificate
        env:
          DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA256: ${{ vars.APPLE_DISTRIBUTION_CERTIFICATE_SHA256 }}
        run: |
          umask 077
          test "$DOPPLER_PROJECT" = gymemo
          test "$DOPPLER_CONFIG" = ci_native_signing
          test -n "$CERTIFICATE_SHA256"
          mkdir -p "$RUNNER_TEMP/gymemo-credential-check"
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/gymemo-credential-check/application.p12"
          printf %s "$CERTIFICATE_PASSWORD" > "$RUNNER_TEMP/gymemo-credential-check/application-password"
          openssl rand -base64 32 > "$RUNNER_TEMP/gymemo-credential-check/keychain-password"
          mise x -- asc signing keychain install --identity "$RUNNER_TEMP/gymemo-credential-check/application.p12" --identity-password-file "$RUNNER_TEMP/gymemo-credential-check/application-password" --keychain "$RUNNER_TEMP/gymemo-credential-check.keychain-db" --keychain-password-file "$RUNNER_TEMP/gymemo-credential-check/keychain-password" --expected-certificate-sha256 "$CERTIFICATE_SHA256" --confirm
      - name: Delete the credential check keychain
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gymemo-credential-check.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/gymemo-credential-check.keychain-db"
          fi
      - name: Delete the private temporary inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/gymemo-credential-check"
  installer:
    name: Check the Mac installer identity without signing
    needs: installer-tool
    runs-on: xcode-27
    timeout-minutes: 10
    environment: native-signing
    permissions:
      contents: read
      actions: read # Downloads the exact importer artifact.
      attestations: read # Verifies the importer before exposing private inputs.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: mise.toml
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: github:rorkai/App-Store-Connect-CLI
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.installer-tool.outputs.artifact }}
          path: installer-tool
          digest-mismatch: error
      - name: Verify the importer source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify installer-tool/xtask --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-credentials.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          chmod 700 installer-tool/xtask
      - name: Verify the selected Mac App Store installer identity
        env:
          DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA256: ${{ vars.APPLE_INSTALLER_CERTIFICATE_SHA256 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/gymemo-installer-check"
          openssl rand -base64 32 > "$RUNNER_TEMP/gymemo-installer-check/keychain-password"
          mise x -- installer-tool/xtask install-mac-installer "$RUNNER_TEMP/gymemo-installer-check.keychain-db" "$RUNNER_TEMP/gymemo-installer-check/keychain-password" "$CERTIFICATE_SHA256" --confirm
      - name: Delete the installer check keychain
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gymemo-installer-check.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/gymemo-installer-check.keychain-db"
          fi
      - name: Delete the private temporary inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/gymemo-installer-check"
  upload:
    name: Check App Store Connect access without uploading
    if: github.ref == 'refs/heads/main' && github.repository_id == '1453033797'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: native-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: mise.toml
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.11.6"
          install_args: github:rorkai/App-Store-Connect-CLI
      - name: Verify the purpose and registered app
        env:
          DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ASC_STRICT_AUTH: "true"
        run: |
          test "$DOPPLER_PROJECT" = gymemo
          test "$DOPPLER_CONFIG" = ci_native_upload
          mise x -- asc apps view --id 6833008455 --fields name,bundleId,primaryLocale --output table
